[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clacklab"
version = "1.0.0"
description = "Ultra-Low-Latency Virtual Mechanical Keyboard for macOS"
readme = "README.md"
authors = [{ name = "ClackLab Authors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.5.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    "pyobjc-framework-Quartz>=9.0",
    "pyobjc-framework-ServiceManagement>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
clacklab = "main:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
