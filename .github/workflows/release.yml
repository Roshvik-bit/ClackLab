name: Build and Release Multiplatform Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pyobjc-framework-Quartz pyobjc-framework-Cocoa

      - name: Build macOS Application & DMG
        run: |
          chmod +x scripts/build_app.sh scripts/build_dmg.sh
          ./scripts/build_dmg.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClackLab-macOS-DMG
          path: dist/ClackLab-v1.0.0-macOS.dmg

      - name: Publish macOS Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-macos
          name: ClackLab v1.0.0 for macOS
          draft: false
          prerelease: false
          files: dist/ClackLab-v1.0.0-macOS.dmg
          body: |
            ## ⌨️ ClackLab for macOS (v1.0.0)

            Download the official disk image installer for Apple Silicon & Intel Macs.

            ### Installation:
            1. Download `ClackLab-v1.0.0-macOS.dmg`.
            2. Double-click the DMG and drag **ClackLab** to your **Applications** folder.
            3. Launch ClackLab and grant Accessibility permission in System Settings when prompted.

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Build Windows Executable
        run: |
          scripts\build_windows.bat
        shell: cmd

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClackLab-Windows-EXE
          path: dist/ClackLab-v1.0.0-Windows.exe

      - name: Publish Windows Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-windows
          name: ClackLab v1.0.0 for Windows
          draft: false
          prerelease: false
          files: dist/ClackLab-v1.0.0-Windows.exe
          body: |
            ## ⌨️ ClackLab for Windows (v1.0.0)

            Download the standalone Windows executable for Windows 10 & Windows 11 (64-bit).

            ### Installation:
            1. Download `ClackLab-v1.0.0-Windows.exe`.
            2. Double-click to run. No installer or administrative privileges required!
